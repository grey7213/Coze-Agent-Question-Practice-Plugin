<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Mock Coze 答题页（真实 ui-builder 结构）</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font: 14px/1.6 "Microsoft YaHei", sans-serif; background: #eef1f4; }
  .coz-layout { height: 100%; display: flex; flex-direction: column; position: relative; }
  .ui-builder-page { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .chat-area { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .scrollable { flex: 1; overflow-y: auto; padding: 20px; }
  .msg-list { display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 12px 14px; border-radius: 10px; background: #fff;
         border: 1px solid #e5e8eb; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: #ddf4e4; }
  .toolbar { display: flex; gap: 10px; padding: 12px 20px; border-top: 1px solid #e5e8eb; background: #fff; }
  .toolbar button { padding: 8px 16px; border: 1px solid #d0d7de; border-radius: 8px;
                    background: #fff; cursor: pointer; font: inherit; }
  .composer { padding: 12px 16px 16px; background: #fff; border-top: 1px solid #e5e8eb;
              display: flex; gap: 10px; align-items: flex-end; }
  textarea.rc-textarea { flex: 1; min-height: 44px; max-height: 120px; padding: 10px 12px;
                         border: 1px solid #d0d7de; border-radius: 8px; font: inherit; resize: none; }
  .send-icon { width: 40px; height: 40px; border: 0; border-radius: 8px; background: #1f883d;
               color: #fff; font-size: 16px; cursor: pointer; }
  .send-icon[disabled] { background: #c9d1d9; cursor: not-allowed; }
</style>
</head>
<body>
<div class="coz-layout flex-1 relative">
  <div id="Page5" class="ui-builder-page">
    <div class="chat-area">
      <div class="scrollable--pkXa6lFnTQUbfv8X scrollable">
        <div class="msg-list"></div>
      </div>
    </div>
    <div class="toolbar">
      <button type="button">查看排行</button>
      <button type="button">返回上一页</button>
    </div>
    <div class="composer">
      <textarea class="rc-textarea textarea--PEOb5lWcoa0bhQpo" placeholder="发送消息"></textarea>
      <button class="send-icon" type="button" disabled><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2l6 6H9v6H7V8H2l6-6z" fill="currentColor"/></svg></button>
    </div>
  </div>
</div>

<script>
(function () {
  const list = document.querySelector('.msg-list');
  const scroll = document.querySelector('.scrollable');
  const ta = document.querySelector('textarea.rc-textarea');
  const sendBtn = document.querySelector('.send-icon');

  const QUESTIONS = [
    { q: '【单选题】(2 分):\n下列运算符中，属于算术运算符的是哪一项？\nA: &&; B: =; C: +; D: ==', a: 'C' },
    { q: '【判断题】(2 分):\nJava 中 String 是不可变类型。', a: '正确' }
  ];

  let idx = -1;
  let waiting = false;
  window.__mock = { log: [], finished: false };

  function append(role, text) {
    const d = document.createElement('div');
    d.className = 'msg' + (role === 'me' ? ' me' : '');
    d.textContent = text;
    list.append(d);
    scroll.scrollTop = scroll.scrollHeight;
    window.__mock.log.push(role + ': ' + text.slice(0, 40));
    return d;
  }

  function botSay(text, delay) {
    setTimeout(() => append('them', text), delay || 150);
  }

  function nextQuestion() {
    idx++;
    if (idx >= QUESTIONS.length) {
      botSay('{"output":"恭喜你！完成了本轮作答。若想继续作答，可回复 “是”。"}', 200);
      window.__mock.finished = true;
      return;
    }
    botSay(QUESTIONS[idx].q, 200);
  }

  function refresh() {
    sendBtn.disabled = !ta.value.trim();
  }
  ta.addEventListener('input', refresh);
  refresh();

  function submit() {
    const text = ta.value.trim();
    if (!text) return;
    append('me', text);
    ta.value = '';
    refresh();
    ta.dispatchEvent(new InputEvent('input', { bubbles: true }));

    if (waiting) {
      if (text === '是') {
        waiting = false;
        nextQuestion();
      }
      return;
    }
    if (idx >= 0 && idx < QUESTIONS.length) {
      waiting = true;
      botSay('你的回答是: ' + text + '\n是否继续下一题？回复「是」。', 300);
    }
  }

  sendBtn.addEventListener('click', submit);
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  setTimeout(() => {
    append('them', '《AI编程工具与高效开发》课程答题智能体');
    botSay('测试同学，欢迎参加本轮作答。', 150);
    setTimeout(nextQuestion, 500);
  }, 100);
})();
</script>
</body>
</html>
