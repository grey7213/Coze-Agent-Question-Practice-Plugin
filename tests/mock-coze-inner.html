<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Mock Coze</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font: 14px/1.6 "Microsoft YaHei", sans-serif; }
  body { display: flex; height: 100vh; background: #eef1f4; }
  aside { width: 220px; padding: 16px; background: #fff; border-right: 1px solid #e5e8eb; }
  aside h3 { margin: 0 0 12px; font-size: 13px; color: #57606a; }
  aside .item { padding: 8px 10px; border-radius: 6px; color: #1f2328; }
  aside .item.active { background: #eef1f4; font-weight: 600; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .top { height: 52px; display: flex; align-items: center; padding: 0 20px; background: #fff; border-bottom: 1px solid #e5e8eb; font-weight: 600; }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 20px; }
  .chat-list { display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 12px 14px; border-radius: 10px; background: #fff; border: 1px solid #e5e8eb; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: #ddf4e4; border-color: #c3e6cd; }
  .composer { display: flex; gap: 10px; align-items: flex-end; padding: 12px 16px 16px; background: #fff; border-top: 1px solid #e5e8eb; }
  .editor {
    flex: 1; min-height: 44px; max-height: 140px; overflow-y: auto; padding: 10px 12px;
    border: 1px solid #d0d7de; border-radius: 8px; outline: none; background: #fff; white-space: pre-wrap;
  }
  .editor:empty::before { content: attr(data-placeholder); color: #8c959f; }
  .send-btn { padding: 0 18px; height: 44px; border: 0; border-radius: 8px; background: #1f883d; color: #fff; font-size: 14px; cursor: pointer; }
  .send-btn[disabled] { background: #94d3a2; cursor: not-allowed; }
</style>
</head>
<body>
<aside>
  <h3>商店 / 学习教育</h3>
  <div class="item active">AI编程工具与高效开发</div>
  <div class="item">期末复习助手</div>
  <div class="item">课程答疑</div>
</aside>
<main>
  <div class="top">AI编程工具与高效开发</div>
  <div class="chat-scroll" id="scroll">
    <div class="chat-list" id="list"></div>
  </div>
  <div class="composer">
    <div class="editor" id="editor" contenteditable="true" role="textbox" data-placeholder="输入消息…"></div>
    <button class="send-btn" id="send" aria-label="发送">发送</button>
  </div>
</main>

<script>
/* 模拟 Coze 机器人：出题 → 判定 → 继续提示 → 下一题 */
(function () {
  const list = document.getElementById('list');
  const scroll = document.getElementById('scroll');
  const editor = document.getElementById('editor');
  const sendBtn = document.getElementById('send');

  const QUESTIONS = [
    {
      q: '第 1 题（单选）Java 中用于声明常量的关键字是？\nA. final\nB. static\nC. const\nD. public',
      answer: 'A'
    },
    {
      q: '第 2 题（判断）在 Java 中，String 是不可变类型。\n',
      answer: '正确'
    },
    {
      q: '第 3 题（多选）下列属于 Spring 核心特性的是？\nA. IOC\nB. AOP\nC. 事务管理\nD. 垃圾回收',
      answer: 'ABC'
    }
  ];

  let idx = -1;
  let waitingAdvance = false;
  window.__mock = { log: [], finished: false };

  function append(role, text) {
    const d = document.createElement('div');
    d.className = 'msg' + (role === 'me' ? ' me' : '');
    d.textContent = text;
    list.append(d);
    scroll.scrollTop = scroll.scrollHeight;
    window.__mock.log.push(role + ': ' + text.slice(0, 40));
    return d;
  }

  function botSay(text, delay) {
    setTimeout(() => append('them', text), delay || 120);
  }

  function nextQuestion() {
    idx++;
    if (idx >= QUESTIONS.length) {
      botSay('全部题目已完成，感谢作答。', 150);
      window.__mock.finished = true;
      return;
    }
    botSay(QUESTIONS[idx].q, 150);
  }

  function judge(text) {
    if (waitingAdvance) {
      if (/^是$/.test(text.trim())) {
        waitingAdvance = false;
        nextQuestion();
      }
      return;
    }
    if (idx >= 0 && idx < QUESTIONS.length && text.trim()) {
      // 模拟判定后给出继续提示
      waitingAdvance = true;
      botSay('回答已记录。是否继续下一题？回复「是」。', 200);
    }
  }

  function submit() {
    const text = editor.innerText.trim();
    if (!text) return;
    append('me', text);
    editor.innerHTML = '';
    editor.dispatchEvent(new InputEvent('input', { bubbles: true }));
    judge(text);
  }

  sendBtn.addEventListener('click', submit);
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  // 首题
  setTimeout(() => {
    append('them', '欢迎来到期末复习。');
    nextQuestion();
  }, 100);
})();
</script>
</body>
</html>
